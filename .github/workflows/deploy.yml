name: Deploy

# main → dev; tag v* → prod. Secrets por GitHub Environment:
#   DATABRICKS_HOST, DATABRICKS_TOKEN (ou OAuth M2M: DATABRICKS_CLIENT_ID/SECRET)
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: databricks/setup-cli@v1.25.0
      - name: Validar bundle
        run: databricks bundle validate -t "$TARGET"
      - name: Deploy
        run: databricks bundle deploy -t "$TARGET"
