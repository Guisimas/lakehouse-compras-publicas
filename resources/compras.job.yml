# Jobs serverless (Free Edition): semanal (agendado) e backfill (sob demanda).
# Uma task por etapa, em sequência; cada etapa processa todas as entidades, o que respeita
# o limite de 5 tasks concorrentes do Free Edition. Retry 2x por task; o run_id do job é
# compartilhado pelas tasks (e pelos retries), ligando Bronze → Silver → Gold do mesmo run.

resources:
  jobs:
    compras_semanal:
      name: compras-semanal
      description: >-
        Carga semanal incremental (os dias desde o último run, até ontem, mais as janelas de
        14 e 30 dias atrás; contratos por varredura de 365 dias)
        → Bronze → Silver → Gold → qualidade → OPTIMIZE.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo
        pause_status: ${var.agendamento}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: data_inicio
          default: ""
        - name: data_fim
          default: ""
        - name: dias_reprocessar
          default: "14,30"
        - name: modo
          default: incremental
        - name: ingestao_no_job
          default: ${var.ingestao_no_job}
        - name: completo
          default: "false"
        - name: falhar_em_aviso
          default: "false"
      environments: &ambiente
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
      tasks: &tarefas
        - task_key: planejar
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          timeout_seconds: 3600
          python_wheel_task:
            package_name: compras
            entry_point: compras-task
            parameters:
              - planejar
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--data-inicio"
              - "{{job.parameters.data_inicio}}"
              - "--data-fim"
              - "{{job.parameters.data_fim}}"
              - "--dias-reprocessar"
              - "{{job.parameters.dias_reprocessar}}"
        - task_key: ingestao
          environment_key: default
          depends_on:
            - task_key: planejar
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          # Run semanal: ~9 janelas de itens (complemento do PNCP, ~20 min cada) + varredura
          # de contratos (~1h40). O run do zero de dev, com 3 janelas, levou 2h36.
          timeout_seconds: 21600
          python_wheel_task:
            package_name: compras
            entry_point: compras-task
            parameters:
              - ingestao
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--janelas"
              - "{{tasks.planejar.values.janelas}}"
              - "--modo"
              - "{{job.parameters.modo}}"
              - "--ingestao-no-job"
              - "{{job.parameters.ingestao_no_job}}"
        - task_key: bronze
          environment_key: default
          depends_on:
            - task_key: ingestao
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          timeout_seconds: 5400
          python_wheel_task:
            package_name: compras
            entry_point: compras-task
            parameters:
              - bronze
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--janelas"
              - "{{tasks.planejar.values.janelas}}"
        - task_key: silver
          environment_key: default
          depends_on:
            - task_key: bronze
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          timeout_seconds: 5400
          python_wheel_task:
            package_name: compras
            entry_point: compras-task
            parameters:
              - silver
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--janelas"
              - "{{tasks.planejar.values.janelas}}"
        - task_key: gold
          environment_key: default
          depends_on:
            - task_key: silver
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          timeout_seconds: 5400
          python_wheel_task:
            package_name: compras
            entry_point: compras-task
            parameters:
              - gold
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--janelas"
              - "{{tasks.planejar.values.janelas}}"
              - "--completo"
              - "{{job.parameters.completo}}"
        - task_key: qualidade
          environment_key: default
          depends_on:
            - task_key: gold
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          timeout_seconds: 3600
          python_wheel_task:
            package_name: compras
            entry_point: compras-task
            parameters:
              - qualidade
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--janelas"
              - "{{tasks.planejar.values.janelas}}"
              - "--falhar-em-aviso"
              - "{{job.parameters.falhar_em_aviso}}"
        - task_key: otimizar
          environment_key: default
          depends_on:
            - task_key: qualidade
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          timeout_seconds: 5400
          python_wheel_task:
            package_name: compras
            entry_point: compras-task
            parameters:
              - otimizar
              - "--catalog"
              - "${var.catalog}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--vacuum"
              - "true"

    compras_backfill:
      name: compras-backfill
      description: >-
        Backfill por parâmetros (data_inicio, data_fim): mesmo código do semanal, em modo
        histórico (inclui endpoints anuais do Legado) e reconstruindo toda a Gold.
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: data_inicio
          default: "2025-11-01"
        - name: data_fim
          default: "2025-11-30"
        - name: dias_reprocessar
          default: ""
        - name: modo
          default: historico
        - name: ingestao_no_job
          default: ${var.ingestao_no_job}
        - name: completo
          default: "true"
        - name: falhar_em_aviso
          default: "false"
      environments: *ambiente
      tasks: *tarefas
